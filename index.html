<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Overview — Listening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="top">
  <div class="inner">
    <span class="mark display">Listening</span>
    <div class="links">
      <a href="index.html">Overview</a>
      <a href="trends.html">Trends</a>
      <a href="year.html">Year in Review</a>
      <a href="artists.html">Artists</a>
      <a href="history.html">History</a>
      <a href="discovery.html">Discovery</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div id="content">
    <div class="status">
      <span class="display">Pulling in the record.</span>
      Fetching your listening history from the archive.
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script>
const DATA_BASE = "data/";

function aggregate(entries) {
  const now = Date.now();
  const totalPlays = entries.length;
  let totalMsPlayed = 0;
  const artistCounts = new Map();
  const trackCounts = new Map();
  const hourDayGrid = Array.from({ length: 7 }, () => Array(24).fill(0));
  let liveCount = 0, extCount = 0, skipCount = 0, skipEligible = 0;

  for (const e of entries) {
    totalMsPlayed += DataCore.playedMs(e);
    if (e.artist) artistCounts.set(e.artist, (artistCounts.get(e.artist) || 0) + 1);
    if (e.track) {
      const key = e.track + " — " + (e.artist || "Unknown");
      trackCounts.set(key, (trackCounts.get(key) || 0) + 1);
    }
    const d = new Date(e.played_at);
    hourDayGrid[d.getUTCDay()][d.getUTCHours()]++;
    if (e.source === "live_poll") liveCount++;
    if (e.source === "extended_history") extCount++;
    if (e.skipped !== null && e.skipped !== undefined) {
      skipEligible++;
      if (e.skipped === true) skipCount++;
    }
  }

  const topArtists = [...artistCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
  const topTracks = [...trackCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);

  const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
  const recentEntries = entries.filter((e) => e.played_at >= sevenDaysAgo);
  const recentTrackCounts = new Map();
  const recentArtistCounts = new Map();
  for (const e of recentEntries) {
    if (e.track) {
      const key = e.track + " — " + (e.artist || "Unknown");
      recentTrackCounts.set(key, (recentTrackCounts.get(key) || 0) + 1);
    }
    if (e.artist) recentArtistCounts.set(e.artist, (recentArtistCounts.get(e.artist) || 0) + 1);
  }
  const topRecentTrack = [...recentTrackCounts.entries()].sort((a, b) => b[1] - a[1])[0];
  const topRecentArtist = [...recentArtistCounts.entries()].sort((a, b) => b[1] - a[1])[0];

  const earliestPlay = entries.reduce((min, e) => Math.min(min, e.played_at), Infinity);
  const spanDays = Math.round((now - earliestPlay) / (1000 * 60 * 60 * 24));

  return {
    totalPlays,
    totalHours: totalMsPlayed / 1000 / 60 / 60,
    uniqueArtists: artistCounts.size,
    uniqueTracks: trackCounts.size,
    topArtists,
    topTracks,
    hourDayGrid,
    liveCount,
    extCount,
    skipCount,
    skipEligible,
    topRecentTrack,
    topRecentArtist,
    recentTotal: recentEntries.length,
    spanDays,
  };
}

function renderHeatmap(grid) {
  const dayLabels = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  let max = 0;
  for (const row of grid) for (const v of row) if (v > max) max = v;

  let html = '<div class="heatmap">';
  for (let d = 0; d < 7; d++) {
    html += `<span class="row-label">${dayLabels[d]}</span>`;
    for (let h = 0; h < 24; h++) {
      const v = grid[d][h];
      const intensity = max > 0 ? v / max : 0;
      const alpha = 0.08 + intensity * 0.85;
      const bg = intensity > 0 ? `rgba(196, 72, 58, ${alpha.toFixed(2)})` : "var(--rule)";
      html += `<span class="cell" style="background:${bg}" title="${dayLabels[d]} ${h}:00 — ${v} plays"></span>`;
    }
  }
  html += "</div>";
  return html;
}

function renderRankedList(title, entries, formatFn, linkToArtist) {
  let html = `<div class="ranked-list"><h3>${title}</h3><ol>`;
  entries.forEach(([name, count]) => {
    const displayName = linkToArtist ? name : name;
    const href = linkToArtist
      ? `artist.html?name=${DataCore.artistSlug(name)}`
      : null;
    const inner = href
      ? `<a class="name" href="${href}">${DataCore.escapeHtml(displayName)}</a>`
      : `<span class="name">${DataCore.escapeHtml(displayName)}</span>`;
    html += `<li>${inner}<span class="count">${formatFn(count)}</span></li>`;
  });
  html += "</ol></div>";
  return html;
}

function render(stats) {
  const skipRate = stats.skipEligible > 0 ? Math.round((stats.skipCount / stats.skipEligible) * 100) : null;
  const sourceLivePct = stats.totalPlays > 0 ? (stats.liveCount / stats.totalPlays) * 100 : 0;
  const sourceExtPct = stats.totalPlays > 0 ? (stats.extCount / stats.totalPlays) * 100 : 0;

  let storyHtml;
  if (stats.topRecentTrack) {
    const [trackName, count] = stats.topRecentTrack;
    const [track] = trackName.split(" — ");
    storyHtml = `
      <p class="story-line">This week, <span class="accent">${DataCore.escapeHtml(track)}</span> played ${count} time${count === 1 ? "" : "s"}.</p>
      <p class="story-sub">${stats.recentTotal.toLocaleString()} plays logged in the last 7 days${stats.topRecentArtist ? `, led by ${DataCore.escapeHtml(stats.topRecentArtist[0])}` : ""}.</p>
    `;
  } else {
    storyHtml = `<p class="story-line">No plays logged in the last 7 days.</p>`;
  }

  document.getElementById("content").innerHTML = `
    <div class="hero count-up">
      <p class="figure display">${DataCore.fmtNum(stats.totalHours)}<em>h</em></p>
      <p class="label">listened across ${stats.spanDays.toLocaleString()} days, from ${stats.uniqueArtists.toLocaleString()} artists.</p>
      <div class="stat-row">
        <div class="stat"><div class="num display">${stats.totalPlays.toLocaleString()}</div><div class="cap">total plays</div></div>
        <div class="stat"><div class="num display">${stats.uniqueTracks.toLocaleString()}</div><div class="cap">distinct tracks</div></div>
        <div class="stat"><div class="num display">${stats.uniqueArtists.toLocaleString()}</div><div class="cap">artists</div></div>
        <div class="stat"><div class="num display">${skipRate !== null ? skipRate + "%" : "—"}</div><div class="cap">skip rate</div></div>
      </div>
    </div>

    <section class="block">
      <div class="heading"><h2>This week</h2></div>
      ${storyHtml}
    </section>

    <section class="block">
      <div class="heading"><h2>When you listen</h2><span class="sub">by hour and day, UTC</span></div>
      ${renderHeatmap(stats.hourDayGrid)}
    </section>

    <section class="block">
      <div class="heading"><h2>Most played</h2><span class="sub"><a href="artists.html">see all artists →</a></span></div>
      <div class="ranked-pair">
        ${renderRankedList("Artists", stats.topArtists, (c) => c.toLocaleString(), true)}
        ${renderRankedList("Tracks", stats.topTracks, (c) => c.toLocaleString(), false)}
      </div>
    </section>

    <section class="block">
      <div class="heading"><h2>Where the data comes from</h2></div>
      <div class="source-bar">
        <div class="seg live" style="width:${sourceLivePct}%"></div>
        <div class="seg ext" style="width:${sourceExtPct}%"></div>
      </div>
      <div class="source-legend">
        <span><span class="dot live"></span>Live poll — ${stats.liveCount.toLocaleString()}</span>
        <span><span class="dot ext"></span>Extended history — ${stats.extCount.toLocaleString()}</span>
      </div>
    </section>

    <footer>Built from ${stats.totalPlays.toLocaleString()} logged plays. Updates daily.</footer>
  `;
}

(async function init() {
  DataCore.setActiveNav();
  try {
    const entries = await DataCore.loadAllEntries(DATA_BASE);
    if (entries.length === 0) {
      DataCore.renderError("content", new Error("No listening data found"));
      return;
    }
    render(aggregate(entries));
  } catch (err) {
    DataCore.renderError("content", err);
  }
})();
</script>

</body>
</html>
