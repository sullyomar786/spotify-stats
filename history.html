<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>History — Listening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="top">
  <div class="inner">
    <span class="mark display">Listening</span>
    <div class="links">
      <a href="index.html">Overview</a>
      <a href="trends.html">Trends</a>
      <a href="artists.html">Artists</a>
      <a href="history.html">History</a>
      <a href="discovery.html">Discovery</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <h1 class="display">History</h1>
    <p>Every logged play, searchable. The full raw record.</p>
  </div>

  <div class="history-controls">
    <input type="text" id="search-box" placeholder="Search track or artist…">
    <select id="sort-select">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </div>

  <div id="content">
    <div class="status"><span class="display">Opening the log.</span> Loading every play on record.</div>
  </div>
</div>

<script src="js/data.js"></script>
<script>
const DATA_BASE = "data/";
const PAGE_SIZE = 100;

let allEntries = [];
let filtered = [];
let currentPage = 0;

function fmtDate(ts) {
  return new Date(ts).toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
  });
}

function renderTable() {
  const start = currentPage * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

  const rows = pageItems
    .map(
      (e) => `
        <tr>
          <td class="date-cell">${fmtDate(e.played_at)}</td>
          <td>${DataCore.escapeHtml(e.track || "—")}</td>
          <td>${DataCore.escapeHtml(e.artist || "—")}</td>
          <td>${e.source === "extended_history" ? DataCore.escapeHtml(e.platform || "—") : "—"}</td>
          <td>${e.skipped === true ? "Yes" : e.skipped === false ? "No" : "—"}</td>
        </tr>
      `
    )
    .join("");

  document.getElementById("content").innerHTML = `
    <section class="block">
      <div class="heading"><h2>${filtered.length.toLocaleString()} plays</h2><span class="sub">showing ${start + 1}–${Math.min(start + PAGE_SIZE, filtered.length)}</span></div>
      <div style="overflow-x:auto;">
        <table class="history-table">
          <thead><tr><th>Played</th><th>Track</th><th>Artist</th><th>Platform</th><th>Skipped</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="5" style="color:var(--text-mid)">No matches.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="history-pagination">
        <span>Page ${currentPage + 1} of ${totalPages}</span>
        <div style="display:flex; gap:8px;">
          <button id="prev-page" ${currentPage === 0 ? "disabled" : ""}>← Prev</button>
          <button id="next-page" ${currentPage >= totalPages - 1 ? "disabled" : ""}>Next →</button>
        </div>
      </div>
    </section>
  `;

  document.getElementById("prev-page")?.addEventListener("click", () => {
    currentPage = Math.max(0, currentPage - 1);
    renderTable();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("next-page")?.addEventListener("click", () => {
    currentPage = Math.min(totalPages - 1, currentPage + 1);
    renderTable();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

function applyFilters() {
  const q = document.getElementById("search-box").value.trim().toLowerCase();
  const sort = document.getElementById("sort-select").value;

  filtered = q
    ? allEntries.filter(
        (e) => (e.track && e.track.toLowerCase().includes(q)) || (e.artist && e.artist.toLowerCase().includes(q))
      )
    : allEntries.slice();

  filtered.sort((a, b) => (sort === "oldest" ? a.played_at - b.played_at : b.played_at - a.played_at));
  currentPage = 0;
  renderTable();
}

(async function init() {
  DataCore.setActiveNav();
  try {
    allEntries = await DataCore.loadAllEntries(DATA_BASE);
    if (allEntries.length === 0) {
      DataCore.renderError("content", new Error("No listening data found"));
      return;
    }
    applyFilters();

    document.getElementById("search-box").addEventListener("input", applyFilters);
    document.getElementById("sort-select").addEventListener("change", applyFilters);
  } catch (err) {
    DataCore.renderError("content", err);
  }
})();
</script>

</body>
</html>
